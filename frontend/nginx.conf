# Nginx 配置：托管 Vue 构建产物 + 反代 /api 到后端容器
# 关键点：
#  - 前端 axios baseURL = '/api'（同源），由 nginx 统一转发 → 无跨域问题
#  - chat/send 需要等待 LLM 工具循环，读写超时需放宽到 300s
#  - SPA 路由用 hash 模式，无需 try_files 回退；保留 / 到 index.html 即可

server {
    listen 80;
    server_name _;

    # 后端 API 反代（compose 服务名 backend，容器内端口 8000）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # LLM 工具循环单轮可能数十秒，放宽超时
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # SSE（若后续加流式输出）
        proxy_buffering off;
    }

    # 静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
